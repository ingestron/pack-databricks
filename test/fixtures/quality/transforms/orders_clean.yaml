apiVersion: ingestron.io/v1
kind: Transform
id: orders_clean
description: Orders with a known customer, one row each.
inputs: [orders]
contract: crm.orders
transform: { uses: pyspark }
code: |
  def transform(tables):
      return tables["orders"].where("customer_id > 0")
cleanse:
  columns:
    status: { case: upper }
  deduplicate: { order_by: [updated_at] }
