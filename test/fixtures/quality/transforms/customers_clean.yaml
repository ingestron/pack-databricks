apiVersion: ingestron.io/v1
kind: Transform
id: customers_clean
description: Customers, cleansed, one row each.
inputs: [customers]
contract: crm.customers
cleanse:
  columns:
    email: { case: lower }
    name: { trim: false }
    country: { map: { "United Kingdom": GB, UK: GB, "-": null }, case: upper }
    status: { default: active }
    score: { map: { "-1": 0 } }
    vip: { default: false }
    contacted_at: { timezone: { from: UTC, to: Europe/London } }
    last_seen: { timezone: { from: Europe/London, to: UTC } }
  deduplicate: { order_by: [updated_at] }
expectations:
  - { name: recent, check: "updated_at >= TIMESTAMP '2000-01-01'", action: fail }
