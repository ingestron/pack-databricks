apiVersion: ingestron.io/v1
kind: Flow
id: crm
description: Customers and orders from the CRM, as they come.
source: crm
tables:
  customers:
    object: customers
    contract: crm.customers
    ingest:
      with: { format: json }
  orders:
    object: orders
    contract: crm.orders
    history: latest
    sequence: updated_at
