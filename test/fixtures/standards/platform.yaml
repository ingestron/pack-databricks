# Where this project's assets go. Values differ per environment.
apiVersion: ingestron.io/v1
kind: Platform
id: lakehouse
tags:
  team: sales
  environment: ${environment.name}
schedule:
  cron: 0 0 5 * * ?
  timezone: Europe/London
alerts:
  - { kind: email, to: [sales-data@example.com], on: [failure, slow] }
  - { kind: destination, id: "${values.teams}" }
databricks:
  workspace:
    host: ${values.host}
  run_as:
    service_principal_name: 7f3c2a10-0000-4000-8000-000000000001
  permissions:
    - group_name: sales-engineers
      level: CAN_MANAGE
    - group_name: sales-analysts
      level: CAN_VIEW
