# Generated by Ingestron from the retail definitions. Do not edit: change the definitions and generate again.
resources:
  jobs:
    retail_refresh:
      name: retail_refresh
      schedule:
        quartz_cron_expression: 0 0 5 * * ?
        timezone_id: Europe/London
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
        - task_key: refresh
          pipeline_task:
            pipeline_id: ${resources.pipelines.retail.id}
          max_retries: 2
          min_retry_interval_millis: 300000
          timeout_seconds: 7200
      tags:
        team: sales
      email_notifications:
        on_failure:
          - sales-data@example.com
        on_duration_warning_threshold_exceeded:
          - sales-data@example.com
      webhook_notifications:
        on_failure:
          - id: ${var.alerts_id}
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 3600
