# Generated by Ingestron from the retail definitions. Do not edit: change the definitions and generate again.
resources:
  jobs:
    retail_refresh:
      name: retail_refresh
      schedule:
        quartz_cron_expression: 0 0 5 * * ?
        timezone_id: Europe/London
      tasks:
        - task_key: refresh
          pipeline_task:
            pipeline_id: ${resources.pipelines.retail.id}
        - task_key: apply_contract
          depends_on:
            - task_key: refresh
          environment_key: ingestron
          spark_python_task:
            python_file: ../tasks/retail/apply_contract.py
            parameters:
              - ingestron.catalog=${var.catalog}
              - ingestron.principal_marketing_analysts=${var.principal_marketing_analysts}
      environments:
        - environment_key: ingestron
          spec:
            environment_version: "6"
      tags:
        team: sales
      email_notifications:
        on_failure:
          - sales-data@example.com
