# Generated by Ingestron from the retail definitions. Do not edit: change the definitions and generate again.
resources:
  pipelines:
    retail:
      name: retail
      catalog: ${var.catalog}
      schema: ${resources.schemas.bronze.name}
      serverless: true
      root_path: ../src/retail
      libraries:
        - glob:
            include: ../src/retail/**
      tags:
        team: sales
      notifications:
        - email_recipients:
            - sales-data@example.com
          alerts:
            - on-update-failure
            - on-update-fatal-failure
            - on-flow-failure
      configuration:
        ingestron.shop_path: ${var.shop_path}
