# Generated by Ingestron from the shop definitions. Do not edit: change the definitions and generate again.
bundle:
  name: shop
include:
  - resources/*.yml
sync:
  exclude:
    - .generated.json
    - .generated.lock
    - prerequisites/**
variables:
  catalog:
    description: Catalog of the shop tables.
  schema_bronze:
    description: Schema of the bronze tables.
  schema_silver:
    description: Schema of the silver tables.
targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: dev
      schema_bronze: bronze_dev
      schema_silver: silver_dev
  prod:
    mode: production
    variables:
      catalog: prod
      schema_bronze: bronze_prod
      schema_silver: silver_prod
